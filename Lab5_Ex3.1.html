<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nhiệm vụ 2.2 – Infographic và video</title>
	<style>
		body { margin: 0; font-family: Arial, sans-serif; color: #243044; background: #f3f6fa; }
		main { max-width: 900px; margin: 40px auto; padding: 24px; }
		h1 { text-align: center; color: #174a7e; }
		.description { text-align: center; margin: 0 auto 28px; max-width: 650px; line-height: 1.6; }
		section { margin: 28px 0; padding: 22px; background: white; border-radius: 12px; box-shadow: 0 3px 14px #172b4d18; }
		h2 { margin-top: 0; color: #174a7e; }
		.infographic { display: block; width: 100%; height: auto; }
		.video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
		.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
		footer { text-align: center; color: #5b6573; font-size: .9rem; padding: 12px; }
	</style>
</head>
<body>
	<main>
		<h1>Nhiệm vụ 2.2: Infographic và video</h1>
		<p class="description">Infographic và video minh họa nội dung bài tập Nhiệm vụ 2.2. Xem hình bên dưới và phát video trực tiếp trên trang.</p>

		<section aria-labelledby="infographic-title">
			<h2 id="infographic-title">Infographic</h2>
			<img class="infographic" src="Lab05_Ex2.1.png" alt="Infographic minh họa nội dung Nhiệm vụ 2.2">
		</section>

		<section aria-labelledby="video-title">
			<h2 id="video-title">Video bài tập</h2>
			<div class="video">
				<iframe src="https://www.youtube.com/embed/pqTf87EtQUU" title="Video bài tập Nhiệm vụ 2.2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
			</div>
		</section>

		<footer>© 2025 — Nội dung phục vụ học tập. Tôn trọng bản quyền hình ảnh và video của chủ sở hữu.</footer>
	</main>
</body>
</html>s
